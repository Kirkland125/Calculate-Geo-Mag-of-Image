<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geomag Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <div class="formula-panel">
            <div class="formula-box">
                Geomag = Pixel Length × Pixel Pitch ÷ Object Length
            </div>
        </div>

        <div class="card">
            <div class="badge">FOR REFERENCE ONLY</div>
            <h1>Calculate Geomag from Image</h1>

            <div class="field">
                <label for="pixelLength">Object Length in Pixels</label>
                <input type="number" id="pixelLength" step="any" placeholder="e.g. 25">
            </div>

            <div class="field">
                <label for="pixelPitch">Pixel Pitch (microns)</label>
                <input type="number" id="pixelPitch" step="any" placeholder="e.g. 5.5">
            </div>

            <div class="field">
                <label for="objectLength">Actual Object Length (microns)</label>
                <input type="number" id="objectLength" step="any" placeholder="e.g. 100">
            </div>

            <button onclick="calculateGeomag()">Calculate Geomag</button>

            <div class="error" id="errorMsg"></div>

            <div class="result" id="resultBox">
                <div class="label">GEOMAG</div>
                <div class="value" id="resultValue">Enter values above</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
